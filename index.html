<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Amphibian Observation Map</title>
  <link rel="stylesheet" href="https://js.arcgis.com/4.29/esri/themes/light/main.css">
  <style>
    html, body, #viewDiv {
      padding: 0;
      margin: 0;
      height: 100%;
      width: 100%;
    }

    #filterPanel {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 99;
      background: white;
      padding: 10px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.3);
    }
  </style>
  <script src="https://js.arcgis.com/4.29/"></script>
</head>
<body>
  <div id="viewDiv"></div>
  <div id="filterPanel">
    <label for="speciesSelect">Select species:</label>
    <select id="speciesSelect">
      <option value="">All</option>
      <option value="Newt">Newt</option>
      <option value="Frog">Frog</option>
      <option value="Salamander">Salamander</option>
    </select>
  </div>

  <script>
    require([
      "esri/Map",
      "esri/views/MapView",
      "esri/layers/FeatureLayer"
    ], function(Map, MapView, FeatureLayer) {

      const amphibianLayer = new FeatureLayer({
        url: "https://services.arcgis.com/V6ZHFr6zdgNZuVG0/ArcGIS/rest/services/Animal_Observations/FeatureServer/0?utm_source=chatgpt.com",
        outFields: ["*"],
        popupTemplate: {
          title: "{Species}",
          content: "Observed on {Date} at {Location}."
        }
      });

      const map = new Map({
        basemap: "topo-vector",
        layers: [amphibianLayer]
      });

      const view = new MapView({
        container: "viewDiv",
        map: map,
        center: [-98, 39],
        zoom: 4
      });

      const speciesSelect = document.getElementById("speciesSelect");
      speciesSelect.addEventListener("change", () => {
        const species = speciesSelect.value;
        amphibianLayer.definitionExpression = species ? Species = '${species}' : null;
      });

    });
  </script>
</body>
</html>
